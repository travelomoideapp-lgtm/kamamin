<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travelomoide</title>
<meta name="description" content="写真を選ぶだけで旅手帳ができる、旅の記録アプリ Travelomoide。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF6EE; --ink: #3B2F2A; --muted: #6E5E54; --accent: #A84E2A; --line: #E8DDCD; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1916; --ink: #F1E6DA; --muted: #C4B4A7; --accent: #E59A76; --line: #46392F; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.85; word-break: auto-phrase;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; font-size: 34px; margin: 16px 0 4px; }
  p { color: var(--muted); }
  ul { text-align: left; display: inline-block; margin: 16px 0 0; padding-left: 1.2em; }
  a { color: var(--accent); }
  nav { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Travelomoide のアイコン">
  <h1>Travelomoide</h1>
  <p>写真を選ぶだけで、旅手帳ができる。<br>旅の思い出を残す Android アプリです。</p>
  <ul>
    <li>写真から旅行の期間・思い出・行った場所をおまかせで作成</li>
    <li>行った都道府県・国を地図で塗りつぶし</li>
    <li>カレンダーで旅をふり返り</li>
    <li>Google ドライブにバックアップ</li>
  </ul>
  <nav><a href="privacy-policy.html">プライバシーポリシー</a></nav>
</main>
</body>
</html>
